<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Validacao das opcoes do portfolio</title>
<style>body{margin:0;background:#e8e8e8;font:13px monospace}pre{padding:20px;white-space:pre-wrap}iframe{display:block;border:0;background:white}body.preview pre{display:none}</style>
<pre id="report">Testes em andamento.</pre>
<iframe id="site" title="Portfolio em teste"></iframe>
<script>
"use strict";
const params = new URL(location.href).searchParams;
const preview = params.get("modo") === "preview";
const frame = document.getElementById("site");
const layouts = ["essencial", "editorial", "tecnico", "classico"];
const themes = ["claro", "escuro"];
const wantedLayout = layouts.includes(params.get("layout")) ? params.get("layout") : "essencial";
const wantedTheme = themes.includes(params.get("tema")) ? params.get("tema") : "claro";
const width = Math.min(1600, Math.max(320, Number(params.get("largura")) || 1280));
frame.style.width = width + "px";
frame.style.height = (Number(params.get("altura")) || 2100) + "px";
document.body.classList.toggle("preview", preview);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
function luminance(hex) {
  const c = hex.trim().replace("#", "");
  const values = [0,2,4].map(n => parseInt(c.slice(n,n+2),16)/255).map(n=>n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4));
  return values[0]*.2126+values[1]*.7152+values[2]*.0722;
}
function contrast(a,b) { const x=luminance(a), y=luminance(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
frame.addEventListener("load", async () => {
  const results = [], failures = [];
  const win = frame.contentWindow, doc = frame.contentDocument;
  const record = (test, pass, details) => { const item={test,pass,details}; results.push(item); if(!pass)failures.push(item); };
  try {
    await doc.fonts.ready;
    await sleep(100);
    record("initial-render", !!doc.querySelector("main h1"));
    if (!doc.querySelector("main h1")) throw new Error("Pagina nao renderizada");
    if (preview) {
      record("preview-theme",doc.documentElement.dataset.theme===wantedTheme);
      record("preview-layout",doc.documentElement.dataset.layout===wantedLayout);
      await sleep(800);
    } else {
      const runtimeErrors = [];
      win.addEventListener("error",e=>runtimeErrors.push(e.message));
      win.addEventListener("unhandledrejection",e=>runtimeErrors.push(String(e.reason)));
      for (const viewport of [320,390,768,1280]) {
        frame.style.width=viewport+"px";
        await sleep(40);
        for (const layout of layouts) {
          doc.querySelector("#tab-"+layout).click();
          await doc.fonts.ready;
          for (const theme of themes) {
            if(doc.documentElement.dataset.theme!==theme)doc.querySelector("#theme-toggle").click();
            await sleep(45);
            const style=win.getComputedStyle(doc.documentElement);
            const bg=style.getPropertyValue("--bg"), muted=style.getPropertyValue("--muted"), ink=style.getPropertyValue("--ink");
            const info={layout,theme,width:viewport,scrollWidth:doc.documentElement.scrollWidth,mutedContrast:Number(contrast(muted,bg).toFixed(2)),font:win.getComputedStyle(doc.querySelector("main h1")).fontFamily};
            record("layout-theme-viewport",doc.documentElement.dataset.layout===layout && doc.documentElement.dataset.theme===theme && doc.documentElement.scrollWidth<=viewport && doc.querySelectorAll('[role="tab"][aria-selected="true"]').length===1,info);
            record("text-contrast",contrast(muted,bg)>=4.5 && contrast(ink,bg)>=4.5,info);
            const ids=[...doc.querySelectorAll("[id]")].map(e=>e.id);
            record("unique-ids",new Set(ids).size===ids.length,{layout,theme,width:viewport});
            record("scroll-targets",[...doc.querySelectorAll("[data-scroll]")].every(e=>doc.getElementById(e.dataset.scroll)),{layout});
            if(layout==="editorial") {
              const image=doc.querySelector(".editorial-figure img");
              const rect=image.getBoundingClientRect();
              record("figure-proportions",Math.abs(rect.width/rect.height-image.naturalWidth/image.naturalHeight)<.02,{theme,width:viewport});
            }
            for (const [value, expected] of [[10,"0,15"],[30,"0,45"],[100,"1,50"]]) {
              const range=doc.querySelector("[data-demo-range]");
              range.value=value; range.dispatchEvent(new win.Event("input",{bubbles:true}));
              record("slider",doc.querySelector("#demo-price").textContent.includes(expected),{layout,theme,value});
            }
            doc.querySelector("[data-demo-range]").value=30;
            doc.querySelector("[data-demo-range]").dispatchEvent(new win.Event("input",{bubbles:true}));
          }
          for(const project of ["solar","amara","dieta","baterias"]) {
            const button=doc.querySelector('[data-project="'+project+'"]');
            button.click();
            record("project-dialog",doc.querySelector("#project-dialog").open && doc.querySelector("#dialog-title").textContent.length>0,{layout,project});
            doc.querySelector(".close-dialog").click();
            record("close-dialog",!doc.querySelector("#project-dialog").open,{layout,project});
          }
        }
      }
      doc.querySelector("#tab-essencial").focus();
      doc.querySelector("#tab-essencial").click();
      doc.querySelector("#tab-essencial").dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));
      record("keyboard-next-tab",doc.documentElement.dataset.layout==="editorial");
      doc.querySelector("#tab-editorial").dispatchEvent(new win.KeyboardEvent("keydown",{key:"End",bubbles:true}));
      record("keyboard-last-tab",doc.documentElement.dataset.layout==="classico");
      doc.querySelector("#tab-classico").dispatchEvent(new win.KeyboardEvent("keydown",{key:"Home",bubbles:true}));
      record("keyboard-first-tab",doc.documentElement.dataset.layout==="essencial");
      const url=new URL(win.location.href); url.hash="tecnico"; url.searchParams.set("tema","escuro");
      win.history.replaceState(null,"",url); win.dispatchEvent(new win.PopStateEvent("popstate"));
      record("deep-link-state",doc.documentElement.dataset.layout==="tecnico" && doc.documentElement.dataset.theme==="escuro");
      record("runtime-errors",runtimeErrors.length===0,runtimeErrors);
    }
    document.getElementById("report").textContent=JSON.stringify({pass:failures.length===0,count:results.length,failures,results},null,2);
  } catch(error) {
    document.getElementById("report").textContent=JSON.stringify({pass:false,error:String(error),count:results.length,failures,results},null,2);
  }
});
frame.src="../index.html?tema="+wantedTheme+"#"+wantedLayout;
</script>
</html>
